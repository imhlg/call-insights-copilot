<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12-Week Plan v2: Senior, Technical and AI Product Manager</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f2328;--mut:#5d6570;--card:#fff;--acc:#1d5fd1;--line:#e3e0d8;--ok:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--fg:#e8e6e1;--mut:#9aa3ad;--card:#1d2227;--acc:#7aa7f5;--line:#2c333a;--ok:#5cc08d}}
:root[data-theme="dark"]{--bg:#15181c;--fg:#e8e6e1;--mut:#9aa3ad;--card:#1d2227;--acc:#7aa7f5;--line:#2c333a;--ok:#5cc08d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.2rem;margin:1.8em 0 .5em;border-bottom:1px solid var(--line);padding-bottom:.25em}
.sub{color:var(--mut);margin:0 0 1em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.box b{display:block;color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 12px}
summary{cursor:pointer;padding:10px 0;font-weight:600}
summary small{color:var(--mut);font-weight:400}
.tag{font-size:.75rem;border-radius:99px;padding:1px 8px;margin-left:6px;border:1px solid var(--ok);color:var(--ok)}
.tag.now{border-color:var(--acc);color:var(--acc)}
.row{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.row span:first-child{color:var(--mut);font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
ul,ol{padding-left:1.2em;margin:.3em 0}li{margin:.25em 0}
.wide{overflow-x:auto}
</style></head>
<body><main>
<h1>12-Week Plan v2: Senior, Technical and AI Product Manager</h1>
<p class="sub">7 Oct to 27 Dec 2026 (buffer 28 to 31 Dec). Weeks run Monday to Sunday. Track 1 is the focus; Principal PM is parked.</p>
<div id="app"></div>
</main>
<script>
const goal=["A PM-framed CV and LinkedIn that get replies","6 sharp product stories","A working, evaluated AI project (call-insights-copilot) with a PRD and architecture document in a public repo","Enough technical fluency to hold your own with engineers","A live pipeline of interviews for Senior, Technical or AI PM roles in CX and enterprise AI","Track 2 (Principal or Staff TPM, forward-deployed and AI solutions roles) at about 30% of application effort"];
const how=[["Build","Hands-on coding in small steps, run yourself. Synthetic or public data only."],["Make","A product document: teardown, metric tree, PRD, pricing sheet."],["Say","Answer out loud: mock interviews and feedback."],["Reach","Outreach and applications."],["Concept of the Week","About 1 hour, weeks 2 to 10. Learn one non-AI system design idea, link it to your own experience, write 5 lines in your own words."],["Hours","About 20 technical hours a week (25 in weeks 6 to 8), 7 search, 12 product practice, 2 admin: 41 to 46 in total, six days, one full day off."]];
const day=["Morning: outreach and applications (2.5 h)","Midday: technical learning (2 h)","Afternoon: product and interview practice (1.5 to 2 h)","Evening free; stop at a fixed time","Sunday review (30 min): replies, screens, shaky topic, weakest interview area, top 3 actions next week. Also score the self-test green, amber or red."];
const phases=[["Weeks 1 to 3 (7 to 25 Oct)","Screen-ready: intro pitch, three behavioral stories, product sense, metrics, AI basics, first public repo. Milestone: 25 Oct."],["Weeks 4 to 5 (26 Oct to 8 Nov)","Core AI product skills: RAG, evals, first design drills. Checkpoint: 8 Nov reply-rate review."],["Weeks 6 to 8 (9 to 29 Nov)","The agent arc: loop, MCP and orchestration, guardrails, observability, red-team tests, PRD. Checkpoint: 22 Nov. Fewer than 2 screens means widen titles and shift weight to Track 2."],["Weeks 9 to 10 (30 Nov to 13 Dec)","Data and deployment: SQL, A/B testing, API in Docker, full mock loops. Fallback decision: 13 Dec."],["Weeks 11 to 12 (14 to 27 Dec)","Polish and close: optional Kubernetes, portfolio polish, negotiation, January pipeline."]];
const W=[
["1","7 to 12 Oct","Foundations and first eval","done","Day 5 scripts; regex and model refund checkers scored with precision and recall","90-second intro and a 'why PM now' answer","Record intro once; coach feedback","10 messages (5 to 6 sent)","Private repo with Day 1 to 5 scripts","","14"],
["2","13 to 18 Oct","Behavioral, product sense, APIs and retrieval basics","now","Structured JSON output with error handling and retries; a real REST API call from Python; keyword-search mini retrieval over 5 synthetic FAQ documents, with sources cited","Product teardown of one real product from the target list; finish the AXM story (own part: informed and consulted, not the decision-maker)","Behavioral mock 1 (intro and AXM)","8 to 10 messages, 3 to 4 applications","README v0: problem statement and first architecture sketch","APIs in depth: REST vs. webhook, status codes, API keys vs. OAuth, rate limits, idempotency","20"],
["3","19 to 25 Oct","Execution, metrics and the first agent","","Tool-use agent v0 with one tool (policy lookup); eval script scoring checker and agent on 20 cases; make the repo public","Metric tree (with a latency guardrail metric); RICE prioritization; U-Analyze and Malayalam stories","Product sense and AI fluency mocks; design drill: sequence diagram of real-time agent assist (Siebel, Genesys)","8 to 10 messages, 3 to 4 applications; 3 teardowns for outreach","Public repo, README, eval results table. Milestone 25 Oct: screen-ready","Latency and SLAs: p50, p95, p99, throughput, SLA vs. SLO","20"],
["4","26 Oct to 1 Nov","RAG","","Real retrieval with embeddings, chunking experiments, vector search with citations; compare with the week 2 keyword version on the same questions","PRD v0; draft pricing sheet","Design drill: a RAG assistant for a contact center","Referral asks for specific open roles","Architecture diagram v1; decision record 1","Databases and caching: SQL vs. NoSQL, indexes, vector databases, cache hit and miss","22"],
["5","2 to 8 Nov","Evals (Diwali week)","","Eval harness: 40-case golden set (negation, conditionals, injection, paraphrase), precision and recall, LLM judge with human spot check, regression runs, cost per call","Pricing sheet from measured token costs (per seat vs. per call)","AI product questions: AI vs. rules (5 practice answers), fallbacks, human in the loop; one mock","Lighter: 8 to 10 messages, 2 applications","Eval report page. Checkpoint 8 Nov","Queues and async work: batch vs. real-time, Kafka or SQS, backpressure","22"],
["6","9 to 15 Nov","Agents, part 1: the loop","","Agent loop with tools, memory across turns, guardrails (refund rule) and human handoff; Udemy modules for concepts","Market sizing for agent assist","Design drill: agentic assistant (single vs. multi-agent, tool permissions, failures); one mock","8 to 10 messages, 4 applications","Decision record 2 (agent design); demo video v1","Reliability: timeouts, retries with backoff, circuit breakers, fallbacks","25"],
["7","16 to 22 Nov","Agents, part 2: MCP and orchestration","","Small MCP server exposing the refund checker and knowledge lookup; router and worker pattern; agent evals for task success and tool-call accuracy","Build-vs-buy story with an AI twist: would you build AXM on today's tools?","Full mock loop 1 (product sense, execution, technical, behavioral)","Keep the weekly rhythm","MCP server folder with its own README. Checkpoint 22 Nov","Scaling and cost: horizontal vs. vertical, load balancers, stateless services, autoscaling vs. manual","25"],
["8","23 to 29 Nov","Agents, part 3: production thinking","","Log every call (tokens, latency, cost, outcome) to SQLite with a cost and quality chart; red-team set (prompt injection, jailbreaks, PII leaks)","PRD v1 final: problem, users, metrics, eval results, risks, rollout, monitoring, incident response, plus a cost model","Incident mock: the agent promised a refund, what do you do?","Keep the weekly rhythm","PRD v1 and red-team report published","Security and privacy: authentication vs. authorization, encryption, PII, multi-tenancy, audit logs","25"],
["9","30 Nov to 6 Dec","Data and experiments","","Synthetic call-records table in SQLite; SQL for funnels, handle time, resolution rate, cohorts; A/B test design for agent assist","Experiment design document","Full mock loop 2; non-AI design drill: multi-channel inbox and routing system (AXM)","Second wave of applications","SQL folder and experiment document","Data pipelines: ETL, warehouse vs. lake, event streaming, A/B test basics","18"],
["10","7 to 13 Dec","Deployment and system design","","Wrap the copilot in a FastAPI service, package it in Docker, call it from a separate script","Final architecture document: components, data flow, scaling, cost, latency, privacy and data residency, failure modes, decisions log","45-minute end-to-end AI design mock with a non-AI follow-up (10x traffic, what breaks first?); company-specific prep","Keep applications and follow-ups going","Architecture document. Checkpoint 13 Dec: fallback decision","Deployment and monitoring: CI/CD, environments, feature flags, canary releases, rollbacks, logs vs. metrics vs. traces","22"],
["11","14 to 20 Dec","Kubernetes stretch and polish","","Optional (8 to 10 h): run the container on local Kubernetes (pods, deployments, services, scaling, limits); skip if in live loops","Portfolio polish: README, demo video, LinkedIn Featured, one write-up post","Negotiation practice","Follow-ups before the year-end freeze","Polished repo","","18"],
["12","21 to 27 Dec","Close","","Maintenance only; fix what interviewers flagged","Offer comparison; plan for the January pipeline","Final mocks for any live loops","Close open threads","","","8"]];
const S=[["Core (1 to 10), all green by week 9",["How an LLM produces an answer and why it sometimes gets it wrong","What RAG is and what breaks it","How to measure quality for an AI feature before launch","How an agent decides what to do and how to keep it safe","How real-time speech analytics works end to end","REST API vs. webhook, and when to use each","What a funnel or cohort query looks like in SQL","What an AI feature costs per call and how to reduce it","How data residency affects architecture","How to run an A/B test on an AI feature"]],["System design (11 to 20), all green by week 10",["What happens when an API call fails: retries, timeouts, idempotency","p50, p95, p99 latency, and why p99 matters more than the average","Batch vs. real-time (post-call analytics vs. live agent assist)","What a message queue does and what problem it solves","Horizontal vs. vertical scaling; when autoscaling saves or wastes money","What a cache is and what can go wrong with one","Authentication vs. authorization; protecting PII in a call transcript","Logs, metrics and traces; what to watch after launching an AI feature","Feature flags and canary releases for safe rollout and rollback","SQL vs. NoSQL vs. vector database: which job each fits"]],["AI and speech (21 to 25), all green by week 12",["Prompting vs. RAG vs. fine-tuning, with a cost example","Tokens and the context window; why long chats cost more","Small vs. large model, and routing between them to save cost","Word error rate and speaker separation; why mono audio hurt U-Analyze","Streaming vs. batch speech recognition and the effect on latency"]]];
const rules=["Referral first: ask for a referral the same day you apply","Messages under 90 words: who you are, one proof point (the AXM cost story), one clear ask","Attach a one-page teardown with 2 or 3 ideas for their product","Mirror the job description in the top third of the CV, honestly","Show work in public: the project and two short posts","State availability: can start immediately","Be plain about the layoff: one factual sentence, then the work","Follow up on day 3 and day 8, short and polite","Apply within 48 hours of a posting, Tuesday to Thursday mornings","Have a 90-second 'why PM now' story"];
const targets=[["8 to 10","warm outreach a week"],["3 to 4","tailored applications a week (from week 2)"],["2 to 3","referral conversations a week (from week 3)"],["3+ / 8+","screens by week 6 / week 10"],["2+","full loops by week 10"]];
const risks=["Downlevelling: most offers may be Senior PM. Decide now whether scope and pay work for you.","Over-building: time-box the project. Small and finished beats large and unfinished.","Technical overreach: never claim what you cannot defend. Talk about what you built, measured and what failed.","Burnout: keep the day off and the fixed finish time.","Slow year-end hiring: outreach and interviews are front-loaded for this reason."];
const li=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
let h="<h2>Goal by week 12</h2>"+li(goal);
h+="<h2>How the plan works</h2><div class='grid'>"+how.map(x=>"<div class='box'><b>"+x[0]+"</b>"+x[1]+"</div>").join("")+"</div><p><b>Sample day</b></p>"+li(day)+"<p>Public repo: <b>call-insights-copilot</b>. Each weekly build becomes a module, and nothing from Uniphore or its customers is used.</p>";
h+="<h2>Phases and checkpoints</h2><div class='grid'>"+phases.map(x=>"<div class='box'><b>"+x[0]+"</b>"+x[1]+"</div>").join("")+"</div>";
h+="<h2>Week by week</h2>";
W.forEach(w=>{const r=(l,t)=>t?"<div class='row'><span>"+l+"</span><span>"+t+"</span></div>":"";
h+="<details"+(w[3]=="now"?" open":"")+"><summary>Week "+w[0]+": "+w[2]+" <small>("+w[1]+", about "+w[10]+" h)</small>"+(w[3]=="done"?"<span class='tag'>complete</span>":w[3]=="now"?"<span class='tag now'>current</span>":"")+"</summary>"+r("Build",w[4])+r("Make",w[5])+r("Say",w[6])+r("Reach",w[7])+r("Portfolio",w[8])+r("Concept",w[9])+"</details>"});
h+="<h2>Self-test: 25 items</h2><p>Explain each to a non-engineer in 2 minutes and to an engineer in 5. Each Sunday mark green (clear, out loud), amber (partly) or red (stuck). Amber and red items go into next week's technical hours.</p>";
let n=1;S.forEach(g=>{h+="<p><b>"+g[0]+"</b></p><ol start='"+n+"'>"+g[1].map(x=>"<li>"+x+"</li>").join("")+"</ol>";n+=g[1].length});
h+="<h2>Outreach targets and playbook</h2><div class='grid'>"+targets.map(x=>"<div class='box'><b>"+x[0]+"</b>"+x[1]+"</div>").join("")+"</div><p><b>Rules</b></p><ol>"+rules.map(x=>"<li>"+x+"</li>").join("")+"</ol>";
h+="<h2>Risks to manage</h2>"+li(risks);
h+="<h2>Copilot modules</h2><div class='wide'>"+li(["Wk 1 summarizer and refund checker","Wk 2 keyword retrieval","Wk 3 tool-use agent and eval script","Wk 4 RAG with embeddings","Wk 5 eval harness","Wk 6 agent loop with guardrails","Wk 7 MCP server","Wk 8 observability and red-team tests","Wk 9 SQL analytics","Wk 10 API in Docker","Wk 11 Kubernetes (optional)"])+"</div>";
document.getElementById("app").innerHTML=h;
</script></body></html>
